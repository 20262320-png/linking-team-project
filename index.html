<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>교실 스마트 대시보드</title>
    <!-- 프로처럼 보이게 하는 디자인(CSS) 뼈대 -->
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .dashboard-container { width: 100%; max-width: 800px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .notice-box { background: #ffeaa7; padding: 15px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; width: 100%; max-width: 800px; text-align: center; color: #d35400; }
        h1, h2 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>📢 2학년 3반 스마트 대시보드</h1>

    <!-- 1. 가짜 데이터(더미)를 넣은 공지사항 (나중에 파이어베이스 데이터로 교체될 자리) -->
    <div class="notice-box">
        🚨 [공지] <span id="notice-text">오늘은 5교시 끝나고 바로 체육관으로 모이세요! (임시 가짜 데이터)</span>
    </div>

    <div class="dashboard-container">
        <!-- 2. 가짜 데이터가 들어간 급식 카드 -->
        <div class="card">
            <h2>🍱 오늘의 급식</h2>
            <p>현미밥, 돈육김치찌개, 계란말이, 깍두기</p>
        </div>
        
        <!-- 3. 가짜 데이터가 들어간 날씨 카드 -->
        <div class="card">
            <h2>🌤️ 현재 날씨</h2>
            <p>기온: 24°C / 맑음</p>
        </div>

        <!-- 4. 가짜 데이터가 들어간 시간표 카드 -->
        <div class="card">
            <h2>📅 다음 시간표</h2>
            <p>3교시: 체육 (운동장)</p>
        </div>
    </div>
</body>
</html>
